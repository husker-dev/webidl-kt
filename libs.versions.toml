[versions]

kotlin = "2.3.20"
kotlin_serialization = "1.10.0"
android_plugin = "9.1.0"
maven_publish = "0.36.0"

[libraries]

kotlin-serialization    = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlin_serialization" }

[plugins]

kotlin-multiplatform    = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android          = { id = "com.android.kotlin.multiplatform.library", version.ref = "android_plugin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
maven_publish           = { id = "com.vanniktech.maven.publish", version.ref = "maven_publish" }